<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0710" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Underworld Gambit</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="portal-frame"><span id="portal-label">Underworld</span></div>
  <div id="turn"></div>
  <div class="board-label" id="lbl-over" hidden>Overworld</div>
  <div class="board-label" id="lbl-under" hidden>Underworld</div>
  <div id="hint"></div>
  <div id="toolbar">
    <button id="btn-switch" title="Switch board">⇅</button>
    <button id="btn-rotate" title="Rotate view">↻</button>
    <button id="btn-tactical" title="Tactical view">▦</button>
    <button id="btn-undo" title="Undo">↶</button>
    <button id="btn-sound" title="Sound">♪</button>
    <button id="btn-home" title="Main menu">⌂</button>
    <button id="btn-cine" title="Cinematic animations on/off">🎬</button>
    <button id="btn-moves" title="Move list">≡</button>
    <button id="btn-new" title="New game">＋</button>
  </div>
  <div id="sound-menu" hidden>
    <div class="sm-head"><b>Sound</b><button id="sm-close" class="link" title="Close">✕</button></div>
    <div class="sm-row" id="row-music">
      <label class="sw" title="Music on/off"><input type="checkbox" id="sm-music" /><span></span></label>
      <span class="sm-name">Music</span>
      <input type="range" id="sm-music-vol" min="0" max="100" step="1" aria-label="Music volume" />
    </div>
    <div class="sm-row" id="row-sfx">
      <label class="sw" title="Sound effects on/off"><input type="checkbox" id="sm-sfx" /><span></span></label>
      <span class="sm-name">Effects</span>
      <input type="range" id="sm-sfx-vol" min="0" max="100" step="1" aria-label="Sound effects volume" />
    </div>
  </div>
  <div id="movelist" hidden></div>
  <div id="promo" hidden></div>
  <div id="banner" hidden></div>
  <div id="tut-ring" hidden></div>
  <div id="coach" hidden>
    <div class="coach-top"><span id="coach-step"></span><button id="coach-skip" class="link">Skip tutorial</button></div>
    <b id="coach-title"></b>
    <p id="coach-text"></p>
    <div id="coach-actions"></div>
  </div>
  <div id="menu" class="menu">
    <div class="menu-panel" id="menu-main">
      <h1>Underworld <span>Gambit</span></h1>
      <p class="tag">Two boards. One crown. Nothing stays dead.</p>
      <button class="big" id="m-single">Single player</button>
      <button class="big alt" id="m-two">Two players <small>same device</small></button>
      <button class="big alt" id="m-tutorial">Tutorial <small>learn the controls and the two-board trick</small></button>
    </div>
    <div class="menu-panel" id="menu-level" hidden>
      <h2>Choose your opponent</h2>
      <div class="levels" id="levels"></div>
      <button class="link" id="m-back">‹ Back</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
