server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json audio/wav application/octet-stream;

  # glTF models and raw buffers are not in nginx's default mime table.
  types {
    model/gltf+json gltf;
    application/octet-stream bin;
  }
  include /etc/nginx/mime.types;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # Vite fingerprints everything under /assets, so it can be cached for a year.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Sounds and models keep stable names: revalidate instead of pinning them.
  location ~* \.(wav|ogg|gltf|bin|png)$ { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }

  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
